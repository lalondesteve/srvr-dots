# Server tmux config, no plugins. Reload with Prefix + r.

# Windows and panes numbered from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Larger scrollback
set -g history-limit 50000

# Activity alerts from other windows
setw -g monitor-activity on
set -g visual-activity on

# Mouse scrolling and pane selection
set -g mouse on

# Faster escape for nvim
set -sg escape-time 0
set -as terminal-overrides ',*:Tc'

# Extended keys: report real keys + modifiers (Ctrl/Alt/Shift) via CSI-u,
# so nvim/pi can distinguish Enter vs C-Enter vs S-Enter, C-i vs Tab, etc.
set -g extended-keys on
set -as terminal-features ',*:extkeys'

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded config"

# Tokyo Night statusline, no plugins
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1e1c2b,fg=#a9b1d6"
set -g status-left "#[fg=#1e1c2b,bg=#40d69b,bold] #S #[fg=#40d69b,bg=#1e1c2b] "
set -g status-right "#[fg=#1e1c2b,bg=#eb75ce]#[fg=#1e1c2b,bg=#eb75ce,bold] %H:%M #[fg=#eb75ce,bg=#1e1c2b] "
setw -g window-status-format "#[fg=#1e1c2b]#[fg=#1e1c2b,bg=#3b4261] #I #W #[fg=#3b4261,bg=#1e1c2b]"
setw -g window-status-current-format "#[fg=#1e1c2b,bg=#7aa2f7]#[fg=#1e1c2b,bg=#7aa2f7,bold] #I #W #[fg=#7aa2f7,bg=#1e1c2b]"
